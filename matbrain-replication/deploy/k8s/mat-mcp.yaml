# Mat-MCP on Kubernetes with autoscaling (paper: Docker containers orchestrated on K8s).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mat-mcp
spec:
  replicas: 2
  selector:
    matchLabels: {app: mat-mcp}
  template:
    metadata:
      labels: {app: mat-mcp}
    spec:
      containers:
        - name: mat-mcp
          image: mat-mcp:latest
          ports: [{containerPort: 8000}]
          env:
            - name: MP_API_KEY
              valueFrom: {secretKeyRef: {name: matbrain-secrets, key: mp_api_key, optional: true}}
            - {name: MATBRAIN_ARTIFACT_DIR, value: /artifacts}
          volumeMounts: [{name: artifacts, mountPath: /artifacts}]
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "8", memory: 32Gi}
          readinessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 10
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: matbrain-artifacts}   # ReadWriteMany: handles are shared across replicas
---
apiVersion: v1
kind: Service
metadata:
  name: mat-mcp
spec:
  selector: {app: mat-mcp}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mat-mcp
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mat-mcp}
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
